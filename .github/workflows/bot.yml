name: 24-7 Scratch AI Bot

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  schedule:
    # Run every 5 hours to stay active 24/7
    - cron: '0 */5 * * *'

concurrency:
  group: scratch-ai-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 340

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scratch AI Service
        env:
          SCRATCH_USERNAME: ${{ secrets.SCRATCH_USERNAME }}
          SCRATCH_PASSWORD: ${{ secrets.SCRATCH_PASSWORD }}
          SCRATCH_PROJECT_ID: ${{ secrets.SCRATCH_PROJECT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL || 'openai/gpt-oss-120b' }}
          PORT: 8080
        run: |
          python bot.py
